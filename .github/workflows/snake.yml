name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # run manually any time
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # LIGHT  = empty cell light grey, dots fade up through emerald, snake = ink (visible on white)
          # DARK   = empty cell GitHub-dark grey, dots emerald, snake = emerald
          # Hex colors MUST be URL-encoded as %23 — a bare `#` is read as a YAML
          # comment, and bare hex (e.g. 1f4d3a) gets injected as invalid CSS
          # (`fill:1f4d3a`), so the browser falls back to black and the whole
          # grid renders black with no green. %23 decodes to `#` -> valid color.
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%231c1c22&color_dots=%23ebedf0,%23c8e9d8,%238fd6b0,%2349b888,%230e9f6e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%230e9f6e&color_dots=%23151b23,%231f4d3a,%232f7d57,%233fae7c,%235ee9a8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

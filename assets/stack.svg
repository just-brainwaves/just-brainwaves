<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" fill="none" role="img" aria-label="Stack">
  <defs>
    <linearGradient id="scard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="ssheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sclip"><rect x="0.5" y="0.5" width="879" height="119" rx="16"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="119" rx="16" fill="url(#scard)" stroke="#1c1c20" stroke-width="1"/>
  <g clip-path="url(#sclip)">
    <rect x="-300" y="0" width="300" height="120" fill="url(#ssheen)">
      <animate attributeName="x" values="-300;880" dur="9s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- header -->
  <circle cx="36" cy="28" r="3" fill="#d4d4d8"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
  <text x="50" y="32" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8a8a92" letter-spacing="2">STACK</text>
  <text x="832" y="32" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#5a5a62" letter-spacing="1">09 / TOOLS</text>
  <line x1="36" y1="44" x2="832" y2="44" stroke="#1c1c20" stroke-width="1"/>

  <!-- pills -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#d4d4d8">
    <g transform="translate(36,58)"><rect width="67" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="33.5" y="17" text-anchor="middle">python</text></g>
    <g transform="translate(115,58)"><rect width="74" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="37" y="17" text-anchor="middle">pytorch</text></g>
    <g transform="translate(201,58)"><rect width="92" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="46" y="17" text-anchor="middle">langchain</text></g>
    <g transform="translate(305,58)"><rect width="40" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="20" y="17" text-anchor="middle">go</text></g>
    <g transform="translate(357,58)"><rect width="54" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="27" y="17" text-anchor="middle">rust</text></g>
    <g transform="translate(423,58)"><rect width="100" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="50" y="17" text-anchor="middle">typescript</text></g>
    <g transform="translate(36,90)"><rect width="86" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="43" y="17" text-anchor="middle">postgres</text></g>
    <g transform="translate(134,90)"><rect width="86" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="43" y="17" text-anchor="middle">pgvector</text></g>
    <g transform="translate(232,90)"><rect width="72" height="26" rx="8" fill="none" stroke="#2a2a30"/><text x="36" y="17" text-anchor="middle">docker</text></g>
  </g>
</svg>

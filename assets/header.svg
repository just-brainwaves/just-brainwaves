<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="Aditya Shrimali — AI Engineer">
  <defs>
    <!-- ===== GRADIENTS ===== -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d0420"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2e97"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== FILTERS ===== -->
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- perspective grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1de9ff" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,monospace; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 4.5s linear infinite; }
      @keyframes scan { 0% { transform: translateY(-40px);} 100% { transform: translateY(360px);} }
      .glitchA { animation: gA 3.6s infinite steps(1); }
      .glitchB { animation: gB 3.6s infinite steps(1); }
      @keyframes gA { 0%,90%,100%{opacity:0;transform:translate(0,0);} 92%{opacity:.85;transform:translate(-3px,1px);} 95%{opacity:.85;transform:translate(2px,-2px);} }
      @keyframes gB { 0%,90%,100%{opacity:0;transform:translate(0,0);} 93%{opacity:.85;transform:translate(3px,-1px);} 97%{opacity:.85;transform:translate(-2px,2px);} }
      .flicker { animation: flick 5s infinite; }
      @keyframes flick { 0%,96%,100%{opacity:1;} 97%{opacity:.4;} 98%{opacity:1;} 99%{opacity:.6;} }
    </style>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glow)"/>

  <!-- perspective floor grid -->
  <g opacity="0.9">
    <rect x="0" y="230" width="1200" height="130" fill="url(#grid)"/>
    <rect x="0" y="230" width="1200" height="130" fill="url(#floor)"/>
    <!-- converging lines -->
    <g stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1">
      <line x1="600" y1="230" x2="-200" y2="360"/>
      <line x1="600" y1="230" x2="150" y2="360"/>
      <line x1="600" y1="230" x2="450" y2="360"/>
      <line x1="600" y1="230" x2="750" y2="360"/>
      <line x1="600" y1="230" x2="1050" y2="360"/>
      <line x1="600" y1="230" x2="1400" y2="360"/>
    </g>
  </g>

  <!-- floating particles -->
  <g fill="#00f0ff">
    <circle cx="120" cy="80" r="2"><animate attributeName="cy" values="320;40" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="160" r="1.6" fill="#ff2e97"><animate attributeName="cy" values="340;20" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="120" r="2.2" fill="#a855f7"><animate attributeName="cy" values="330;30" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90" r="1.8"><animate attributeName="cy" values="350;50" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="200" r="1.5" fill="#39ff14"><animate attributeName="cy" values="320;10" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="60" r="1.7" fill="#ff2e97"><animate attributeName="cy" values="300;20" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== HUD CORNER BRACKETS ===== -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" class="flicker">
    <path d="M24 50 V24 H50"/>
    <path d="M1150 24 H1176 V50"/>
    <path d="M24 310 V336 H50"/>
    <path d="M1176 310 V336 H1150"/>
  </g>

  <!-- ===== TERMINAL TAG ===== -->
  <g class="mono">
    <rect x="40" y="44" width="250" height="26" rx="4" fill="#0f1320" stroke="#a855f7" stroke-opacity="0.5"/>
    <circle cx="56" cy="57" r="4" fill="#ff5f56"/>
    <circle cx="70" cy="57" r="4" fill="#ffbd2e"/>
    <circle cx="84" cy="57" r="4" fill="#27c93f"/>
    <text x="100" y="61" fill="#7dd3fc" font-size="13">~/aditya — zsh — 80x24</text>
  </g>

  <!-- ===== GLITCH TITLE ===== -->
  <g class="mono" text-anchor="middle" font-weight="700">
    <!-- glitch ghosts -->
    <text class="glitchA" x="600" y="170" font-size="74" fill="#ff2e97" opacity="0">ADITYA SHRIMALI</text>
    <text class="glitchB" x="600" y="170" font-size="74" fill="#00f0ff" opacity="0">ADITYA SHRIMALI</text>
    <!-- main -->
    <text x="600" y="170" font-size="74" fill="url(#neon)" filter="url(#blurGlow)">ADITYA SHRIMALI</text>
  </g>

  <!-- ===== SUBTITLE ===== -->
  <g class="mono" text-anchor="middle">
    <text x="600" y="212" font-size="19" fill="#9eecff" letter-spacing="3" filter="url(#softGlow)">
      &gt; AI&#160;ENGINEER<tspan fill="#a855f7"> // </tspan>LLM&#160;SYSTEMS<tspan fill="#a855f7"> // </tspan>RAG&#160;ARCHITECT<tspan class="blink" fill="#39ff14">_</tspan>
    </text>
  </g>

  <!-- status line -->
  <g class="mono" text-anchor="middle">
    <text x="600" y="248" font-size="13" fill="#5b6b86" letter-spacing="2">ONLINE&#160;&#160;&#160;//&#160;&#160;&#160;<tspan fill="#00f0ff">PYTHON LANGCHAIN VECTORDB</tspan>&#160;&#160;&#160;//&#160;&#160;&#160;<tspan fill="#ff2e97">AGENTIC MODE</tspan></text>
  </g>

  <!-- ===== SCANLINE ===== -->
  <rect class="scan" x="0" y="0" width="1200" height="3" fill="#00f0ff" opacity="0.12"/>
  <rect x="0" y="0" width="1200" height="360" rx="16" fill="none" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>

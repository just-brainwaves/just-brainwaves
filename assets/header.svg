<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Aditya Shrimali — AI Engineer">
  <defs>
    <!-- ===== TOKENS via gradients ===== -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfbfa"/>
    </linearGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e9f6e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0e9f6e"/>
      <stop offset="100%" stop-color="#0e9f6e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111114"/>
      <stop offset="62%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0e9f6e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0e9f6e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0e9f6e" stop-opacity="0"/>
    </radialGradient>

    <!-- faint blueprint grid -->
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0e9f6e" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1" fill="#9aa0a6" fill-opacity="0.22"/>
    </pattern>

    <style>
      .sans  { font-family:'Segoe UI','SF Pro Display','Helvetica Neue',-apple-system,system-ui,sans-serif; }
      .mono  { font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',monospace; }

      /* self-drawing frame */
      .draw { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 4.5s ease-in-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .draw2 { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw2 3.2s ease-in-out 0.4s forwards; }
      @keyframes draw2 { to { stroke-dashoffset: 0; } }

      /* gentle staggered rise */
      .rise { opacity:0; transform: translateY(8px); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1{animation-delay:.5s;} .d2{animation-delay:.8s;} .d3{animation-delay:1.1s;} .d4{animation-delay:1.4s;}
      @keyframes rise { to { opacity:1; transform: translateY(0);} }

      .blink { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }

      .breathe { animation: breathe 5s ease-in-out infinite; }
      @keyframes breathe { 0%,100%{opacity:.5;} 50%{opacity:1;} }
    </style>
  </defs>

  <!-- ===== CANVAS ===== -->
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#paper)" stroke="#e9eae7" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#halo)"/>

  <!-- ===== ARCHITECTURAL FRAME (draws itself) ===== -->
  <g fill="none" stroke="#0e9f6e" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
    <path class="draw" d="M44 44 H300 M44 44 V120 M1156 276 H900 M1156 276 V200"/>
  </g>
  <g fill="none" stroke="#cfd2cd" stroke-width="1" stroke-linecap="round">
    <path class="draw2" d="M44 160 H210 M990 160 H1156 M600 40 V18 M600 280 V302"/>
  </g>

  <!-- registration ticks -->
  <g stroke="#0e9f6e" stroke-width="1.4" class="breathe">
    <path d="M44 44 l10 0 M44 44 l0 10"/>
    <path d="M1156 276 l-10 0 M1156 276 l0 -10"/>
  </g>

  <!-- ===== TRAVELING DATA PULSES (the refined 'matrix' flow) ===== -->
  <g>
    <circle r="3" fill="#0e9f6e">
      <animateMotion path="M44 120 V44 H300" dur="3.6s" begin="2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0e9f6e">
      <animateMotion path="M1156 200 V276 H900" dur="3.6s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== EYEBROW TAG ===== -->
  <g class="mono rise d1">
    <rect x="478" y="62" width="244" height="26" rx="13" fill="#ffffff" stroke="#e3e5e1"/>
    <circle cx="498" cy="75" r="3.5" fill="#0e9f6e"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="514" y="79" font-size="12.5" letter-spacing="3" fill="#6b7280">AVAILABLE&#160;FOR&#160;BUILDING</text>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g class="sans rise d2" text-anchor="middle">
    <text x="600" y="172" font-size="72" font-weight="700" letter-spacing="-1" fill="url(#wordmark)">Aditya Shrimali</text>
  </g>

  <!-- ===== SUBTITLE ===== -->
  <g class="mono rise d3" text-anchor="middle">
    <text x="600" y="214" font-size="15.5" letter-spacing="4" fill="#52525b">
      AI&#160;ENGINEER<tspan fill="#0e9f6e">&#160;&#160;/&#160;&#160;</tspan>LLM&#160;SYSTEMS<tspan fill="#0e9f6e">&#160;&#160;/&#160;&#160;</tspan>RAG&#160;ARCHITECTURE<tspan class="blink" fill="#0e9f6e">_</tspan>
    </text>
  </g>

  <!-- ===== STATUS STRIP ===== -->
  <g class="mono rise d4" text-anchor="middle">
    <line x1="430" y1="244" x2="770" y2="244" stroke="url(#inkFade)" stroke-width="1.2"/>
    <text x="600" y="270" font-size="11.5" letter-spacing="2.5" fill="#9aa0a6">
      PYTHON<tspan fill="#cbd0cb">&#160;&#160;·&#160;&#160;</tspan>LANGCHAIN<tspan fill="#cbd0cb">&#160;&#160;·&#160;&#160;</tspan>VECTOR&#160;DB<tspan fill="#cbd0cb">&#160;&#160;·&#160;&#160;</tspan>AGENTS
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Aditya Shrimali — AI Engineer">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfbfa"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="78%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0e9f6e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#0e9f6e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0e9f6e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9aa0a6" fill-opacity="0.16"/>
    </pattern>

    <style>
      .sans { font-family:'Segoe UI','SF Pro Display','Helvetica Neue',-apple-system,system-ui,sans-serif; }
      .mono { font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',monospace; }

      .draw { stroke-dasharray:520; stroke-dashoffset:520; animation:draw 2.4s ease-in-out .2s forwards; }
      @keyframes draw { to { stroke-dashoffset:0; } }

      .rise { opacity:0; transform:translateY(10px); animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1{animation-delay:.45s;} .d2{animation-delay:.7s;} .d3{animation-delay:.95s;}
      @keyframes rise { to { opacity:1; transform:translateY(0); } }

      .blink { animation:blink 1.15s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }

      .pulse { animation:pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#paper)" stroke="#e9eae7" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#halo)"/>

  <!-- minimal architectural corner brackets (self-drawing) -->
  <g fill="none" stroke="#0e9f6e" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round">
    <path class="draw" d="M52 52 H132 M52 52 V112"/>
    <path class="draw" d="M1148 248 H1068 M1148 248 V188"/>
  </g>

  <!-- eyebrow -->
  <g class="mono rise d1" text-anchor="middle">
    <text x="600" y="95" font-size="12.5" letter-spacing="3.5" fill="#6b7280"><tspan class="pulse" fill="#0e9f6e">●</tspan>  OPEN TO COLLABORATION</text>
  </g>

  <!-- wordmark -->
  <g class="sans rise d2" text-anchor="middle">
    <text x="600" y="172" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#wordmark)">Aditya Shrimali</text>
  </g>

  <!-- subtitle -->
  <g class="mono rise d3" text-anchor="middle">
    <text x="600" y="214" font-size="14.5" letter-spacing="4.5" fill="#52525b">
      AI ENGINEER<tspan fill="#0e9f6e">  ·  </tspan>LLM SYSTEMS<tspan fill="#0e9f6e">  ·  </tspan>RAG ARCHITECTURE<tspan class="blink" fill="#0e9f6e">_</tspan>
    </text>
  </g>
</svg>
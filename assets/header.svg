<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Aditya Shrimali — AI Engineer">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#30363d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="62%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#8b949e" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style>
      .sans { font-family:'Segoe UI','SF Pro Display','Helvetica Neue',-apple-system,system-ui,sans-serif; }
      .mono { font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',monospace; }

      .draw { stroke-dasharray:520; stroke-dashoffset:520; animation:draw 2.4s ease-in-out .2s forwards; }
      @keyframes draw { to { stroke-dashoffset:0; } }

      .rise { opacity:0; transform:translateY(10px); animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1{animation-delay:.45s;} .d2{animation-delay:.7s;} .d3{animation-delay:.95s;}
      @keyframes rise { to { opacity:1; transform:translateY(0); } }

      .blink { animation:blink 1.15s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }

      .pulse { animation:pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="1.5" y="1.5" width="1197" height="297" rx="22" fill="url(#canvas)" stroke="url(#border)" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="22" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="22" fill="url(#halo)"/>

  <!-- accent glow behind wordmark -->
  <ellipse cx="600" cy="160" rx="300" ry="46" fill="#10b981" fill-opacity="0.10" filter="url(#soft)"/>

  <!-- minimal architectural corner brackets (self-drawing) -->
  <g fill="none" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round">
    <path class="draw" d="M52 52 H132 M52 52 V112"/>
    <path class="draw" d="M1148 248 H1068 M1148 248 V188"/>
  </g>

  <!-- eyebrow -->
  <g class="mono rise d1" text-anchor="middle">
    <text x="600" y="95" font-size="12.5" letter-spacing="3.5" fill="#8b949e"><tspan class="pulse" fill="#10b981">●</tspan>  OPEN TO COLLABORATION</text>
  </g>

  <!-- wordmark -->
  <g class="sans rise d2" text-anchor="middle">
    <text x="600" y="172" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#wordmark)">Aditya Shrimali</text>
  </g>

  <!-- subtitle -->
  <g class="mono rise d3" text-anchor="middle">
    <text x="600" y="214" font-size="14.5" letter-spacing="4.5" fill="#8b949e">
      AI ENGINEER<tspan fill="#10b981">  ·  </tspan>LLM SYSTEMS<tspan fill="#10b981">  ·  </tspan>RAG ARCHITECTURE<tspan class="blink" fill="#34d399">_</tspan>
    </text>
  </g>
</svg>

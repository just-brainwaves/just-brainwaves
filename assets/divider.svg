<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="28" viewBox="0 0 1100 28" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <line x1="40" y1="14" x2="1060" y2="14" stroke="url(#line)" stroke-width="1.4"/>

  <!-- soft traveling glow -->
  <circle cy="14" r="9" fill="url(#pulse)" opacity="0.85">
    <animate attributeName="cx" values="120;980;120" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <circle cy="14" r="2.6" fill="#34d399">
    <animate attributeName="cx" values="120;980;120" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>

  <!-- center diamond node -->
  <g transform="translate(550 14)">
    <rect x="-5" y="-5" width="10" height="10" fill="#0d1117" stroke="#10b981" stroke-width="1.4" transform="rotate(45)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

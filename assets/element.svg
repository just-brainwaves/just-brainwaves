<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      /* Background and Line Styling */
      .bg { fill: #050507; }
      .line-cyan { stroke: #00e5ff; fill: none; stroke-width: 1.5; }
      .line-magenta { stroke: #ff0055; fill: none; stroke-width: 1.5; }
      .line-white { stroke: #ffffff; fill: none; stroke-width: 1; opacity: 0.8; }
      
      /* Animation Classes */
      .spin-slow-cw { transform-origin: 400px 400px; animation: spin 24s linear infinite; }
      .spin-slow-ccw { transform-origin: 400px 400px; animation: spin-ccw 30s linear infinite; }
      .spin-fast-cw { transform-origin: 400px 400px; animation: spin 12s linear infinite; }
      .spin-fast-ccw { transform-origin: 400px 400px; animation: spin-ccw 14s linear infinite; }
      
      .pulse-slow { transform-origin: 400px 400px; animation: pulse 4s ease-in-out infinite alternate; }
      .pulse-fast { transform-origin: 400px 400px; animation: pulse 1.5s ease-in-out infinite alternate; }
      
      .dash-flow { animation: dash 40s linear infinite; }
      
      /* Keyframes */
      @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
      }
      @keyframes spin-ccw { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(-360deg); } 
      }
      @keyframes pulse { 
        0% { transform: scale(0.92); opacity: 0.7; } 
        100% { transform: scale(1.08); opacity: 1; } 
      }
      @keyframes dash { 
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1000; } 
      }
    </style>
    
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" class="bg"/>

  <g filter="url(#neon-glow)">
    
    <g class="spin-slow-cw">
      <circle cx="400" cy="400" r="340" class="line-white dash-flow" stroke-dasharray="4 12" stroke-width="1" />
      <circle cx="400" cy="400" r="320" class="line-cyan dash-flow" stroke-dasharray="1 15" stroke-width="4" />
    </g>

    <g class="spin-slow-ccw">
      <circle cx="400" cy="400" r="360" class="line-magenta dash-flow" stroke-width="1.5" stroke-dasharray="20 40 5 40" />
      <circle cx="400" cy="400" r="280" class="line-white dash-flow" stroke-dasharray="150 30 10 30" stroke-width="1" />
    </g>

    <g class="spin-fast-cw pulse-slow">
      <rect x="220" y="220" width="360" height="360" class="line-cyan" />
      <rect x="220" y="220" width="360" height="360" class="line-cyan" transform="rotate(45 400 400)" />
      <circle cx="400" cy="400" r="254.5" class="line-magenta" stroke-dasharray="4 8" />
    </g>

    <g class="spin-fast-ccw pulse-slow">
      <rect x="260" y="260" width="280" height="280" class="line-magenta" />
      <rect x="260" y="260" width="280" height="280" class="line-magenta" transform="rotate(45 400 400)" />
      <circle cx="400" cy="400" r="198" class="line-cyan dash-flow" stroke-dasharray="4 12" />
    </g>

    <g class="spin-slow-cw">
      <polygon points="400,280 504,340 504,460 400,520 296,460 296,340" class="line-white" stroke-width="1.5"/>
      <polygon points="400,280 504,340 504,460 400,520 296,460 296,340" class="line-white" stroke-width="1.5" transform="rotate(30 400 400)"/>
    </g>
    
    <g class="spin-fast-ccw">
      <circle cx="400" cy="400" r="100" class="line-cyan dash-flow" stroke-dasharray="40 10 5 10" stroke-width="2" />
      <polygon points="400,315 473.6,442.5 326.4,442.5" class="line-magenta" stroke-width="2"/>
      <polygon points="400,485 473.6,357.5 326.4,357.5" class="line-magenta" stroke-width="2"/>
    </g>

    <g class="pulse-fast">
      <circle cx="400" cy="400" r="45" class="line-cyan" stroke-width="2" stroke-dasharray="10 5" />
      <circle cx="400" cy="400" r="20" class="line-white" fill="#00e5ff" fill-opacity="0.15" />
      
      <line x1="400" y1="330" x2="400" y2="470" class="line-white" />
      <line x1="330" y1="400" x2="470" y2="400" class="line-white" />
      <line x1="350" y1="350" x2="450" y2="450" class="line-white" />
      <line x1="350" y1="450" x2="450" y2="350" class="line-white" />
      
      <circle cx="400" cy="400" r="8" fill="#ffffff" />
    </g>
  </g>
</svg>

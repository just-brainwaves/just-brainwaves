<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" fill="none" role="img" aria-label="Agentic Cognitive Architecture pipeline">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="finalNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="bg" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8b949e" fill-opacity="0.09"/>
    </pattern>
    <filter id="glowDot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <style>
      .sans { font-family:'Segoe UI','SF Pro Display','Helvetica Neue',-apple-system,system-ui,sans-serif; }
      .mono { font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',monospace; }

      .node { opacity:0; transform:translateY(8px); animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
      .n0{animation-delay:.3s;} .n1{animation-delay:.5s;} .n2{animation-delay:.7s;}
      .n3{animation-delay:.9s;} .n4{animation-delay:1.1s;}
      @keyframes rise { to { opacity:1; transform:translateY(0); } }

      .link { stroke-dasharray:60; stroke-dashoffset:60; animation:draw .5s ease forwards; }
      .l0{animation-delay:.55s;} .l1{animation-delay:.75s;} .l2{animation-delay:.95s;} .l3{animation-delay:1.15s;}
      @keyframes draw { to { stroke-dashoffset:0; } }

      .head { opacity:0; animation:fade .8s ease .15s forwards; }
      @keyframes fade { to { opacity:1; } }
    </style>
  </defs>

  <rect x="14" y="18" width="872" height="252" rx="18" fill="#10b981" opacity="0.06"/>
  <rect x="10" y="12" width="872" height="252" rx="18" fill="url(#card)" stroke="url(#cardBorder)" stroke-width="1.5"/>
  <rect x="10" y="12" width="872" height="252" rx="18" fill="url(#bg)"/>

  <g class="head">
    <circle cx="42" cy="46" r="4" fill="#10b981"/>
    <text x="56" y="50" class="mono" font-size="12.5" letter-spacing="3" fill="#8b949e">AGENTIC&#160;COGNITIVE&#160;ARCHITECTURE</text>
    <text x="846" y="50" text-anchor="end" class="mono" font-size="12" letter-spacing="1.5" fill="#586069">how I think about agent workflows</text>
  </g>
  <line x1="42" y1="66" x2="846" y2="66" stroke="#21262d" stroke-width="1"/>

  <g fill="none" stroke="#30363d" stroke-width="1.6" stroke-linecap="round">
    <path class="link l0" d="M192 158 H219"/>
    <path class="link l1" d="M357 158 H384"/>
    <path class="link l2" d="M522 158 H549"/>
    <path class="link l3" d="M687 158 H714"/>
  </g>

  <g class="node n0">
    <rect x="60" y="126" width="132" height="64" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="60" y="126" width="132" height="64" rx="13" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.03;0.078;0.13;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="126" y="156" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#e6edf3">Goal</text>
    <text x="126" y="175" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1" fill="#8b949e">tasks</text>
  </g>

  <g class="node n1">
    <rect x="225" y="126" width="132" height="64" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="225" y="126" width="132" height="64" rx="13" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.24;0.288;0.34;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="291" y="156" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#e6edf3">Plan</text>
    <text x="291" y="175" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1" fill="#8b949e">reasoning</text>
  </g>

  <g class="node n2">
    <rect x="390" y="126" width="132" height="64" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="390" y="126" width="132" height="64" rx="13" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.45;0.5;0.55;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="456" y="156" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#e6edf3">Execute</text>
    <text x="456" y="175" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1" fill="#8b949e">actions</text>
  </g>

  <g class="node n3">
    <rect x="555" y="126" width="132" height="64" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="555" y="126" width="132" height="64" rx="13" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.66;0.713;0.76;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="621" y="156" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#e6edf3">State</text>
    <text x="621" y="175" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1" fill="#8b949e">context</text>
  </g>

  <g class="node n4">
    <rect x="720" y="126" width="132" height="64" rx="13" fill="url(#finalNode)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="720" y="126" width="132" height="64" rx="13" fill="none" stroke="#d1fae5" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.87;0.923;0.97;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="786" y="156" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#04130d">Generate</text>
    <text x="786" y="175" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1" fill="#0a3a28">llm</text>
  </g>

  <circle r="4.5" fill="#5ee9a8" opacity="0" filter="url(#glowDot)">
    <animateMotion path="M126 158 H786" dur="4s" begin="1.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#5ee9a8" opacity="0">
    <animateMotion path="M126 158 H786" dur="4s" begin="1.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="446" y="238" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="0.4" fill="#8b949e">
    currently exploring <tspan fill="#e6edf3" font-weight="600">Agentic Frameworks</tspan><tspan fill="#586069"> — </tspan>cognitive, workflow-driven intelligence
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="430" height="132" viewBox="0 0 430 132" fill="none" role="img" aria-label="moonshrine — hyprland desktop rice">
  <defs>
    <linearGradient id="pjc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/><stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="pjtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pjsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pjdots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#2a2a30" fill-opacity="0.45"/>
    </pattern>
    <clipPath id="pjclip"><rect x="0.5" y="0.5" width="429" height="131" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="429" height="131" rx="16" fill="url(#pjc)" stroke="#1c1c20"/>
  <g clip-path="url(#pjclip)">
    <rect x="0" y="0" width="430" height="132" fill="url(#pjdots)"/>
    <rect x="1" y="1" width="428" height="60" rx="15" fill="url(#pjtop)"/>
    <!-- header -->
    <circle cx="28" cy="28" r="3" fill="#e8e8ea"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <text x="40" y="32" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8a8a92" letter-spacing="2">PROJECT</text>
    <text x="408" y="32" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#5a5a62" letter-spacing="1">03 / 04</text>
    <line x1="22" y1="44" x2="408" y2="44" stroke="#1c1c20"/>
    <!-- body -->
    <text x="22" y="84" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Inter,sans-serif" font-size="26" font-weight="650" letter-spacing="-0.6" fill="#e8e8ea">moonshrine</text>
    <text x="22" y="106" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8a8a92" letter-spacing="0.5">hyprland desktop rice</text>
    <!-- footer -->
    <text x="22" y="118" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#5a5a62" letter-spacing="0.5">moonshrine.workers.dev</text>
    <g transform="translate(330,100)">
      <rect width="78" height="24" rx="8" fill="#0d0d10" stroke="#2a2a30"/>
      <rect width="78" height="24" rx="8" fill="none" stroke="#e8e8ea" stroke-opacity="0">
        <animate attributeName="stroke-opacity" values="0;0.30;0" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="33" y="16" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#d4d4d8" letter-spacing="1">VISIT</text>
      <path d="M56 12 l5 0 m-2 -2.5 l2 2.5 l-2 2.5" stroke="#e8e8ea" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <rect x="-160" y="0" width="160" height="132" fill="url(#pjsheen)">
      <animate attributeName="x" values="-160;430" dur="7s" begin="1.7999999999999998s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

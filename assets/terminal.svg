<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" fill="none" role="img" aria-label="System boot log">
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <style>
      .m { font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace; font-size:15px; }
      .row { opacity:0; }
      .c { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      /* staggered reveal */
      .r1{animation:in .01s linear .2s forwards;}
      .r2{animation:in .01s linear .8s forwards;}
      .r3{animation:in .01s linear 1.4s forwards;}
      .r4{animation:in .01s linear 2.1s forwards;}
      .r5{animation:in .01s linear 2.8s forwards;}
      .r6{animation:in .01s linear 3.5s forwards;}
      .r7{animation:in .01s linear 4.2s forwards;}
      .r8{animation:in .01s linear 4.9s forwards;}
      .r9{animation:in .01s linear 5.6s forwards;}
      .r10{animation:in .01s linear 6.3s forwards;}
      @keyframes in { to { opacity:1; } }
      .bar { animation: load 6s linear forwards; }
      @keyframes load { from { width:0; } to { width:300px; } }
    </style>
  </defs>

  <rect width="900" height="430" rx="12" fill="url(#term)" stroke="#1f2a44" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="0" y="0" width="900" height="34" rx="12" fill="#11162a"/>
  <rect x="0" y="22" width="900" height="12" fill="#11162a"/>
  <circle cx="22" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="66" cy="17" r="5.5" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" class="m" fill="#5b6b86" font-size="13">aditya@brainwaves: ~/boot</text>

  <g class="m" filter="url(#g)">
    <text class="row r1" x="22" y="72"  fill="#39ff14">aditya@brainwaves<tspan fill="#5b6b86">:</tspan><tspan fill="#00f0ff">~</tspan><tspan fill="#5b6b86">$</tspan> <tspan fill="#e6edf3">sudo ./initialize_human.sh</tspan></text>
    <text class="row r2" x="22" y="100" fill="#7dd3fc">[<tspan fill="#39ff14">  OK  </tspan>] Mounting neural pathways ...........................<tspan fill="#39ff14"> done</tspan></text>
    <text class="row r3" x="22" y="128" fill="#7dd3fc">[<tspan fill="#39ff14">  OK  </tspan>] Loading module <tspan fill="#ff2e97">generative_ai.ko</tspan> ....................<tspan fill="#39ff14"> done</tspan></text>
    <text class="row r4" x="22" y="156" fill="#7dd3fc">[<tspan fill="#39ff14">  OK  </tspan>] Spawning daemon <tspan fill="#a855f7">rag_pipeline.service</tspan> ............<tspan fill="#39ff14"> done</tspan></text>
    <text class="row r5" x="22" y="184" fill="#7dd3fc">[<tspan fill="#ffb000"> WARN </tspan>] Caffeine reserves at <tspan fill="#ffb000">12%</tspan> — refill recommended</text>
    <text class="row r6" x="22" y="212" fill="#7dd3fc">[<tspan fill="#39ff14">  OK  </tspan>] Embedding vectors into pgvector @ 1536d ...........<tspan fill="#39ff14"> done</tspan></text>
    <text class="row r7" x="22" y="240" fill="#e6edf3">&gt; whoami</text>
    <text class="row r8" x="22" y="268" fill="#9eecff">  name      : <tspan fill="#fff">Aditya Shrimali</tspan></text>
    <text class="row r9" x="22" y="290" fill="#9eecff">  role      : <tspan fill="#ff2e97">AI Engineer</tspan> · LLMs · Agents · RAG</text>
    <text class="row r9" x="22" y="312" fill="#9eecff">  learning  : <tspan fill="#39ff14">Agentic AI</tspan> &lt;current_obsession&gt;</text>
    <text class="row r10" x="22" y="334" fill="#9eecff">  building  : <tspan fill="#a855f7">Kyren</tspan> // contact: aditya.shrimali.dev@gmail.com</text>

    <text class="row r10" x="22" y="372" fill="#39ff14">aditya@brainwaves<tspan fill="#5b6b86">:</tspan><tspan fill="#00f0ff">~</tspan><tspan fill="#5b6b86">$</tspan> <tspan fill="#e6edf3">_</tspan><tspan class="c" fill="#39ff14">█</tspan></text>
  </g>

  <!-- progress bar -->
  <rect x="22" y="392" width="300" height="8" rx="4" fill="#1a2238"/>
  <rect class="bar" x="22" y="392" width="0" height="8" rx="4" fill="#39ff14"/>
  <text x="335" y="400" class="m" font-size="12" fill="#5b6b86">boot complete</text>
</svg>

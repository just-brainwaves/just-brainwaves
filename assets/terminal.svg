<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" fill="none" role="img" aria-label="whoami console">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbfa"/>
      <stop offset="100%" stop-color="#f2f3f0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e9f6e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0e9f6e" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#0e9f6e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m { font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code',monospace; font-size:14.5px; }
      .row { opacity:0; }
      .c { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .r1{animation:in .01s linear .3s forwards;}
      .r2{animation:in .01s linear .9s forwards;}
      .r3{animation:in .01s linear 1.5s forwards;}
      .r4{animation:in .01s linear 2.1s forwards;}
      .r5{animation:in .01s linear 2.7s forwards;}
      .r6{animation:in .01s linear 3.3s forwards;}
      .r7{animation:in .01s linear 3.9s forwards;}
      .r8{animation:in .01s linear 4.5s forwards;}
      .r9{animation:in .01s linear 5.0s forwards;}
      .r10{animation:in .01s linear 5.5s forwards;}
      .r11{animation:in .01s linear 6.1s forwards;}
      @keyframes in { to { opacity:1; } }
      .bar { animation: load 6s cubic-bezier(.4,0,.2,1) forwards; }
      @keyframes load { from { width:0; } to { width:300px; } }
    </style>
  </defs>

  <!-- card + soft shadow -->
  <rect x="14" y="16" width="872" height="392" rx="16" fill="#e8e9e6" opacity="0.6"/>
  <rect x="10" y="10" width="872" height="392" rx="16" fill="url(#card)" stroke="#e6e7e3" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M10 26 a16 16 0 0 1 16 -16 h840 a16 16 0 0 1 16 16 v22 h-872 z" fill="url(#chrome)"/>
  <line x1="10" y1="48" x2="882" y2="48" stroke="#e6e7e3" stroke-width="1"/>
  <circle cx="34" cy="29" r="5.5" fill="#fbb4af"/>
  <circle cx="54" cy="29" r="5.5" fill="#fdd9a0"/>
  <circle cx="74" cy="29" r="5.5" fill="#a7e3c4"/>
  <text x="446" y="34" text-anchor="middle" class="m" fill="#9aa0a6" font-size="12.5">aditya@brainwaves — ~/whoami</text>

  <g class="m">
    <text class="row r1" x="30" y="86"  fill="#0e9f6e">aditya<tspan fill="#b8bcc0">@</tspan><tspan fill="#3f3f46">brainwaves</tspan> <tspan fill="#b8bcc0">~</tspan> <tspan fill="#0e9f6e">$</tspan> <tspan fill="#1c1c22">./initialize.sh</tspan></text>

    <text class="row r2"  x="30" y="116" fill="#9aa0a6">[<tspan fill="#0e9f6e">ok</tspan>]  mounting neural pathways<tspan fill="#cbd0cb">  ·····················</tspan><tspan fill="#0e9f6e"> done</tspan></text>
    <text class="row r3"  x="30" y="142" fill="#9aa0a6">[<tspan fill="#0e9f6e">ok</tspan>]  loading <tspan fill="#1c1c22">generative_ai</tspan><tspan fill="#cbd0cb">  ·······················</tspan><tspan fill="#0e9f6e"> done</tspan></text>
    <text class="row r4"  x="30" y="168" fill="#9aa0a6">[<tspan fill="#0e9f6e">ok</tspan>]  spawning <tspan fill="#1c1c22">rag_pipeline.service</tspan><tspan fill="#cbd0cb">  ·········</tspan><tspan fill="#0e9f6e"> done</tspan></text>
    <text class="row r5"  x="30" y="194" fill="#9aa0a6">[<tspan fill="#c2851b">~~</tspan>]  caffeine reserves at <tspan fill="#c2851b">12%</tspan> — refill recommended</text>
    <text class="row r6"  x="30" y="220" fill="#9aa0a6">[<tspan fill="#0e9f6e">ok</tspan>]  embedding vectors @ <tspan fill="#1c1c22">1536d</tspan><tspan fill="#cbd0cb">  ················</tspan><tspan fill="#0e9f6e"> done</tspan></text>

    <line x1="30" y1="238" x2="690" y2="238" stroke="url(#rule)" stroke-width="1.2" class="row r6"/>

    <text class="row r7"  x="30" y="264" fill="#3f3f46">&gt; <tspan fill="#1c1c22">whoami</tspan></text>
    <text class="row r8"  x="30" y="290" fill="#9aa0a6">  name      <tspan fill="#1c1c22" font-weight="600">Aditya Shrimali</tspan></text>
    <text class="row r9"  x="30" y="314" fill="#9aa0a6">  role      <tspan fill="#0e9f6e">AI Engineer</tspan>  ·  LLMs  ·  Agents  ·  RAG</text>
    <text class="row r10" x="30" y="338" fill="#9aa0a6">  building  <tspan fill="#1c1c22">Kyren</tspan>  <tspan fill="#cbd0cb">//</tspan>  learning  <tspan fill="#0e9f6e">Agentic AI</tspan></text>

    <text class="row r11" x="30" y="378" fill="#0e9f6e">aditya<tspan fill="#b8bcc0">@</tspan><tspan fill="#3f3f46">brainwaves</tspan> <tspan fill="#b8bcc0">~</tspan> <tspan fill="#0e9f6e">$</tspan> <tspan class="c" fill="#1c1c22">▍</tspan></text>
  </g>

  <!-- progress -->
  <rect x="592" y="370" width="300" height="6" rx="3" fill="#eef0ec"/>
  <rect class="bar" x="592" y="370" width="0" height="6" rx="3" fill="#0e9f6e"/>
</svg>

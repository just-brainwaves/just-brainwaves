<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" fill="none" role="img" aria-label="Currently building">
  <defs>
    <linearGradient id="fcard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="fsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclip"><rect x="0.5" y="0.5" width="879" height="167" rx="16"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="167" rx="16" fill="url(#fcard)" stroke="#1c1c20" stroke-width="1"/>

  <g clip-path="url(#fclip)">
    <rect x="-300" y="0" width="300" height="168" fill="url(#fsheen)">
      <animate attributeName="x" values="-300;880" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </rect>

    <!-- window header -->
    <circle cx="28" cy="22" r="4" fill="#2f2f35"/>
    <circle cx="44" cy="22" r="4" fill="#2f2f35"/>
    <circle cx="60" cy="22" r="4" fill="#3a3a40"/>
    <text x="440" y="26" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#5a5a62" letter-spacing="1">~/kyren — zsh</text>
    <circle cx="790" cy="22" r="3.5" fill="#d4d4d8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <text x="832" y="26" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8a8a92" letter-spacing="2">LIVE</text>
    <line x1="0" y1="44" x2="880" y2="44" stroke="#1c1c20" stroke-width="1"/>

    <!-- body -->
    <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">
      <text x="36" y="76" fill="#8a8a92">$</text>
      <text x="56" y="76" fill="#5a5a62">now</text>
      <text x="36" y="100" fill="#8a8a92">→</text>
      <text x="58" y="100" fill="#e8e8ea">building <tspan fill="#d4d4d8">Kyren</tspan> · an agentic AI platform</text>

      <text x="36" y="130" fill="#8a8a92">$</text>
      <text x="56" y="130" fill="#5a5a62">focus</text>
      <text x="36" y="154" fill="#8a8a92">→</text>
      <text x="58" y="154" fill="#d4d4d8">agentic systems · RAG eval · LLM infra</text>
    </g>
    <!-- the single living element: a blinking caret -->
    <rect x="350" y="144" width="7" height="13" fill="#d4d4d8">
      <animate attributeName="opacity" values="0;0;0.85;0.85" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" fill="none" role="img" aria-label="Aditya Shrimali — AI Engineer">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="topGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="0.5" y="0.5" width="879" height="169" rx="16"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="169" rx="16" fill="url(#card)" stroke="#1c1c20" stroke-width="1"/>

  <g clip-path="url(#cardclip)">
    <!-- a single slow sheen, the only large motion -->
    <rect x="-300" y="0" width="300" height="170" fill="url(#sheen)">
      <animate attributeName="x" values="-300;880" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="878" height="84" rx="15" fill="url(#topGlass)"/>
  </g>

  <!-- monogram -->
  <g transform="translate(48,40)">
    <rect x="0.5" y="0.5" width="35" height="35" rx="8" fill="none" stroke="#2a2a30" stroke-width="1"/>
    <text x="18" y="24" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14" font-weight="600" fill="#d4d4d8" letter-spacing="0.5">AS</text>
  </g>

  <!-- name -->
  <text x="98" y="62" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#e8e8ea">Aditya Shrimali</text>

  <!-- status dot + role — the single quiet sign of life -->
  <circle cx="100" cy="96" r="3.5" fill="#d4d4d8">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <text x="114" y="100" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#8a8a92" letter-spacing="1.5">AI&#160;ENGINEER</text>

  <!-- right meta -->
  <text x="832" y="62" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#5a5a62" letter-spacing="1">@just-brainwaves</text>

  <!-- hairline -->
  <line x1="48" y1="126" x2="832" y2="126" stroke="#1c1c20" stroke-width="1"/>

  <!-- foot -->
  <text x="48" y="150" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#5a5a62" letter-spacing="0.5">RAG · LLM SYSTEMS · AGENTS</text>
  <text x="832" y="150" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#5a5a62" letter-spacing="0.5">India · UTC+5:30</text>
</svg>
